<!DOCTYPE html>
<html>
<head>
<title>Session Requests • SkillSwap+</title>
<style>
body { font-family: Poppins, sans-serif; padding:20px; background:#f4f5f7; }
.container { max-width:1000px; margin:auto; }
.box { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); margin-bottom:20px; }
.request { padding:12px; border-bottom:1px solid #eee; cursor:pointer; }
.request:hover { background:#eef3ff; }
.btn { padding:10px 16px; border:none; color:white; cursor:pointer; border-radius:6px; font-size:14px; }
.accept { background:#16a34a; }
.reject { background:#dc2626; }
</style>
</head>

<body>

<div class="container">
<h2>Incoming Session Requests</h2>

<div class="box">
  <div id="requestsContainer">Loading...</div>
</div>

<div class="box">
  <h3>Details</h3>
  <p id="selectedRequestText">Select a request</p>
  <button class="btn accept" id="acceptBtn">Accept</button>
  <button class="btn reject" id="rejectBtn">Reject</button>
</div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, where, getDocs, updateDoc, doc } 
from "https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js";

let requestsList = [];
let selectedRequest = null;

auth.onAuthStateChanged(async (user)=>{
  if(!user) location.href="login.html";
  loadRequests(user.uid);
});

async function loadRequests(mentorId){
  const q = query(collection(db,"sessionRequests"), where("mentorId","==",mentorId), where("status","==","pending"));
  const snap = await getDocs(q);
  
  const container = document.getElementById("requestsContainer");
  container.innerHTML = "";

  if(snap.empty){
    container.innerHTML = `<p>No new requests</p>`;
    return;
  }

  snap.forEach(d=>{
    const req = { id:d.id, ...d.data() };
    requestsList.push(req);

    const div = document.createElement("div");
    div.className="request";
    div.innerHTML = `${req.studentName} → ${req.skillName}`;
    div.onclick = ()=>select(req);
    container.appendChild(div);
  });
}

function select(req){
  selectedRequest = req;
  document.getElementById("selectedRequestText").innerText =
    `${req.studentName} wants session on: ${req.skillName}`;
}

document.getElementById("acceptBtn").onclick = ()=> updateStatus("accepted");
document.getElementById("rejectBtn").onclick = ()=> updateStatus("rejected");

async function updateStatus(newStatus){
  if(!selectedRequest) return alert("Select a request!");
  await updateDoc(doc(db,"sessionRequests",selectedRequest.id),{
    status:newStatus
  });
  alert("Updated successfully!");
  location.reload();
}
</script>

</body>
</html>
