<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillSwap+ — Login</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
      margin: 0;
    }
    .wrap {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 { margin: 0 0 8px; color:#222; }
    p { margin: 0 0 20px; color:#666; font-size:14px; }

    label { display:block; text-align:left; margin-bottom:5px; color:#333; font-size:14px; }
    input {
      width: 100%;
      padding: 12px;
      border:1px solid #ccc;
      border-radius:6px;
      margin-bottom: 14px;
      font-size:14px;
    }
    .roles {
      display: flex;
      gap: 12px;
      justify-content:center;
      margin-bottom: 12px;
    }
    .role {
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
    }

    button {
      width:100%;
      background:#2d89ef;
      color:white;
      border:0;
      padding:12px;
      border-radius:6px;
      font-size:15px;
      cursor:pointer;
      margin-top:10px;
      font-weight:bold;
    }
    button:hover { background:#1a63bd; }

    .error {
      color:#e01e37;
      font-size:13px;
      display:none;
      margin-top:5px;
    }
    .footer {
      margin-top:15px;
      font-size:13px;
    }
    a { color:#2d89ef; text-decoration:none; }
  </style>
</head>
<body>

  <div class="wrap">
    <h2>Welcome Back 👋</h2>
    <p>Login and continue your learning journey!</p>

    <form id="loginForm">

      <label>Email</label>
      <input id="email" type="email" required placeholder="you@example.com">

      <label>Password</label>
      <input id="password" type="password" required placeholder="Enter password">

      <label>Select Role</label>
      <div class="roles">
        <label class="role"><input type="radio" name="roleLogin" value="student" checked> Student</label>
        <label class="role"><input type="radio" name="roleLogin" value="mentor"> Mentor</label>
      </div>

      <div class="error" id="errorBox"></div>

      <button type="submit">Login</button>
    </form>

    <div class="footer">
      New user? <a href="register.html">Create an account</a>
    </div>
  </div>


<!-- Firebase Script -->
<script type="module">
  import { auth, db } from "./firebase.js";
  import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js";

  const loginForm = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    let selectedRole = document.querySelector("input[name='roleLogin']:checked").value;

    try {
      const userCred = await signInWithEmailAndPassword(auth, email, password);
      const uid = userCred.user.uid;

      const snap = await getDoc(doc(db, "users", uid));
      if (!snap.exists()) throw new Error("User record missing in database!");

      const roleInDB = snap.data().role;
      
      if (roleInDB !== selectedRole) {
        await signOut(auth);
        errorBox.innerHTML = "⚠ Wrong role selected! Please select correct role.";
        errorBox.style.display = "block";
        return;
      }

      // 🚀 Redirect by role
      window.location.href = (roleInDB === "student")
        ? "student_dashboard.html"
        : "mentor_dashboard.html";

    } catch (err) {
      errorBox.innerHTML = err.message;
      errorBox.style.display = "block";
    }
  });
</script>
</body>
</html>
