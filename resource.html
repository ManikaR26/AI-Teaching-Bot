<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap+ — Resources</title>

<style>
  body { margin:0; font-family: Segoe UI, sans-serif; background:#f4f6f8; }
  header { background:#2d89ef; padding:15px; text-align:center; color:white; }

  .container {
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 15px rgba(0,0,0,0.08);
  }

  h2 { margin-top:0; color:#2d89ef; }

  .upload-box {
    border:2px dashed #2d89ef;
    padding:20px;
    border-radius:8px;
    text-align:center;
    margin-bottom:20px;
  }

  .upload-box input {
    margin-top:10px;
  }

  .resource-list { margin-top:20px; }
  .card {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-radius:8px;
    background:#f4f7ff;
    margin-bottom:10px;
  }
  .card-title { font-weight:bold; color:#333; }
  .download-btn {
    background:#2d89ef; color:white; border:none;
    padding:8px 16px; border-radius:6px; cursor:pointer;
  }
  .download-btn:hover { background:#1b6edc; }
  footer { text-align:center; margin-top:40px; font-size:13px; color:#666; }
</style>
</head>
<body>

<header>
  <h1>Community Resources</h1>
</header>

<div class="container">
  <h2>Upload Study Material</h2>

  <div class="upload-box">
    <input type="file" id="fileInput" />
    <input type="text" id="titleInput" placeholder="Enter title (required)" style="width:80%; padding:8px; margin-top:10px;">
    <button onclick="uploadFile()" style="background:#2d89ef;color:white;padding:8px 16px;border:none;border-radius:6px;margin-top:10px;">
      Upload
    </button>
    <p id="uploadStatus" style="color:#555;margin-top:6px;"></p>
  </div>

  <h2>Available Resources</h2>
  <div class="resource-list" id="resourceList">Loading...</div>
</div>

<footer>
  © 2025 SkillSwap+ | Notes shared by students ❤️
</footer>

<script type="module">
import { auth, db, storage } from "./firebase.js";
import {
  collection,
  addDoc,
  onSnapshot,
  orderBy,
  query,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/9.6.11/firebase-storage.js";

const listDiv = document.getElementById("resourceList");
const fileInput = document.getElementById("fileInput");
const titleInput = document.getElementById("titleInput");
const uploadStatus = document.getElementById("uploadStatus");

// Check Login 🔐
auth.onAuthStateChanged((user) => {
  if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
  }
});

// Load all notes 📚
function loadResources() {
  const q = query(collection(db, "resources"), orderBy("uploadedAt", "desc"));

  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      listDiv.innerHTML = "<p>No resources uploaded yet.</p>";
      return;
    }

    listDiv.innerHTML = "";
    snapshot.forEach((doc) => {
      const data = doc.data();
      listDiv.innerHTML += `
        <div class="card">
          <div>
            <div class="card-title">${data.title}</div>
            <div style="font-size:12px;color:#555;">Uploaded by: ${data.uploaderName}</div>
          </div>
          <button class="download-btn" onclick="window.open('${data.url}', '_blank')">Download</button>
        </div>
      `;
    });
  });
}
loadResources();

// Upload File 📤
window.uploadFile = async function () {
  const file = fileInput.files[0];
  const title = titleInput.value.trim();
  const user = auth.currentUser;

  if (!file) return alert("Choose a file first!");
  if (!title) return alert("Enter title!");
  if (!user) return alert("You must be logged in!");

  uploadStatus.textContent = "Uploading... ⏳";

  try {
    const fileRef = ref(storage, `resources/${Date.now()}_${file.name}`);
    await uploadBytes(fileRef, file);
    const url = await getDownloadURL(fileRef);

    await addDoc(collection(db, "resources"), {
      title,
      url,
      uploaderName: user.email,
      uploaderUID: user.uid,
      uploadedAt: serverTimestamp(),
    });

    uploadStatus.textContent = "Uploaded Successfully! 🎉";
    fileInput.value = "";
    titleInput.value = "";
  } catch (err) {
    console.error(err);
    uploadStatus.textContent = "Upload Failed ❌";
  }
};
</script>

</body>
</html>
